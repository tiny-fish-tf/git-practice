name: Create Issue on Push
on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  create-issue:
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BRANCH: ${{ github.ref_name }}
      PUSHER: ${{ github.event.pusher.name }}
      COMMIT_SHA: ${{ github.sha }}
      COMMIT_MSG: ${{ github.event.head_commit.message }}
      COMPARE_URL: ${{ github.event.compare }}

    steps:
      # 1. GitHub CLI 사용
      - name: Create issue with GitHub CLI
        run: |
          TITLE="[Push] $BRANCH 브랜치에 새 커밋 (${COMMIT_SHA:0:7})"
          BODY=$(printf '## Push 알림 (GitHub CLI)\n\n- 브랜치: `%s`\n- 푸시한 사람: @%s\n- 커밋: %s\n- 메시지: %s\n- 변경 비교: %s\n' \
            "$BRANCH" "$PUSHER" "$COMMIT_SHA" "$COMMIT_MSG" "$COMPARE_URL")

          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/issues" \
            -f title="$TITLE" \
            -f body="$BODY" \
            --jq '.html_url'

      # 2. curl 사용
      - name: Create issue with curl
        run: |
          TITLE="[Push] $BRANCH 브랜치에 새 커밋 (${COMMIT_SHA:0:7}) - curl"
          BODY=$(printf '## Push 알림 (curl)\n\n- 브랜치: `%s`\n- 푸시한 사람: @%s\n- 커밋: %s\n- 메시지: %s\n' \
            "$BRANCH" "$PUSHER" "$COMMIT_SHA" "$COMMIT_MSG")

          # jq로 JSON을 만들어서 따옴표·줄바꿈이 섞여도 깨지지 않게 함
          PAYLOAD=$(jq -n --arg title "$TITLE" --arg body "$BODY" \
            '{title: $title, body: $body, labels: ["push"]}')

          curl -L --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues" \
            -d "$PAYLOAD"
